services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chanel_db
      POSTGRES_USER: chanel_user
      POSTGRES_PASSWORD: chanel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanel_user -d chanel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
